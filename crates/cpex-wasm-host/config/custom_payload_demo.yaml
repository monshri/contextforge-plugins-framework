# Custom Payload Demo Configuration
#
# Demonstrates dispatching a non-CMF payload (ToolInvokePayload) through a WASM plugin.
# The plugin receives a Payload::Custom JSON envelope and passes it through unchanged.

plugin_settings:
  routing_enabled: true

global:
  policies:
    all:
      plugins: [custom-handler]

plugins:
  - name: custom-handler
    kind: wasm://plugin.wasm
    hooks: [tool_pre_invoke]
    mode: sequential
    priority: 10
    on_error: fail
    capabilities: []
    config:
      sandbox_policy:
        allowed_filesystem: []
        allowed_network: []
        allowed_env: []
        resources:
          max_memory_bytes: 10485760
          max_fuel: 1000000000
          max_execution_time_ms: 5000
          max_instances: 10
          max_tables: 10

routes:
  - tool: "*"
    plugins: []
